<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #080810;
  color: white;
  font-family: 'Poppins', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 460px;
  text-align: center;
  padding: 38px 25px;
  border: 1px solid #292945;
  border-radius: 25px;
  background: linear-gradient(145deg,#17172b,#0b0b16);
  box-shadow: 0 0 45px rgba(94,70,255,.15);
}

.logo {
  width: 125px;
  height: 125px;
  margin: 0 auto 25px;
  border-radius: 50%;
  background: linear-gradient(135deg,#7b45ff,#00c6ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  font-weight: 900;
  box-shadow: 0 0 35px rgba(110,80,255,.5);
  border: 4px solid #fff;
}

.badge {
  display: inline-block;
  padding: 7px 17px;
  background: rgba(0,210,140,.12);
  color: #00e9a2;
  border: 1px solid #00b982;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(28px,7vw,38px);
  line-height: 1.25;
  font-weight: 900;
  background: linear-gradient(90deg,#fff,#a68bff,#36d9ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.description {
  color: #aaaabe;
  font-size: 14px;
  line-height: 1.8;
  margin: 20px 0 27px;
}

.telegram-btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(90deg,#6545ff,#168bff);
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 800;
  transition: .3s;
  box-shadow: 0 7px 25px rgba(90,80,255,.3);
}

.telegram-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(90,80,255,.5);
}

.footer {
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid #292940;
  color: #77778f;
  font-size: 11px;
  letter-spacing: 1px;
}

.footer strong {
  color: #a58bff;
}

</style>

<body>

<div class="container">

  <div class="logo">PB</div>

  <div class="badge">✦ OFFICIAL COMMUNITY ✦</div>

  <h1>PIYUSH BHAI COMMUNITY</h1>

  <p class="description">
    Welcome to our official community!
    Join us to stay connected and explore
    community updates, discussions and more.
  </p>

  <a class="telegram-btn"
     href="https://t.me/+E8z2pPHJz_owODJl"
     target="_blank">
     ✈ JOIN TELEGRAM
  </a>

  <div class="footer">
    POWERED BY <strong>FLOX ADS</strong>
  </div>

</div>

</body>
